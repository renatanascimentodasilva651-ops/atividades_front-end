    <link rel="stylesheet" href="./styles/global.css">
    <script src="./scripts/index.js" defer></script>
    <title>@media e localStorage</title>
</head>
<body>

        <h1>@media e localStorage</h1>

    <main>
        <section class="caixa">

            <p>Redimensione a janela do navegador para ver a mudança.</p>

        <section>

            <button type="button" onclick="salvar()">Salvar</button>

            <p id="saudacao"></p>

    </main>
    <footer>
        <p>Projeto para conhecermos @media e localStorage</p>
    </footer>
